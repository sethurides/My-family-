<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Money</title><meta name="theme-color" content="#1565c0"><link rel="manifest" href="manifest.json"><style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f7fb;
  color:#222;
}

header{
  background:#1565c0;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
}

.container{
  padding:15px;
  max-width:650px;
  margin:auto;
}

.card{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.balance{
  font-size:30px;
  font-weight:bold;
  color:#1565c0;
}

.row{
  display:flex;
  gap:10px;
}

.box{
  flex:1;
  padding:12px;
  border-radius:12px;
  background:#f1f5f9;
  text-align:center;
}

.box b{
  display:block;
  margin-top:6px;
  font-size:20px;
}

input,select,button{
  width:100%;
  padding:13px;
  margin-top:9px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  background:#1565c0;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

button.green{
  background:#159447;
}

button.dark{
  background:#222;
}

button.orange{
  background:#ef6c00;
}

button.red{
  background:#d32f2f;
}

.lang{
  width:auto;
  float:right;
  margin-top:-35px;
  padding:7px 12px;
  background:white;
  color:#1565c0;
}

.transaction{
  padding:12px;
  border-bottom:1px solid #eee;
}

.transaction:last-child{
  border-bottom:none;
}

.income{
  color:green;
}

.expense{
  color:red;
}

#reader{
  width:100%;
  margin-top:12px;
}

.qr-result{
  background:#f1f8ff;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  display:none;
}

.small{
  font-size:13px;
  color:#666;
}

.hidden{
  display:none;
}
</style></head><body><header>
  <button class="lang" onclick="toggleLanguage()" id="langBtn">
    తెలుగు
  </button>  <h1 id="title">My Money</h1>
  <p id="subtitle">Income & Expenses</p>
</header><div class="container">  <!-- DASHBOARD -->  <div class="card">
    <h3 id="balanceTitle">Total Balance</h3><div class="balance">
  ₹<span id="balance">0</span>
</div>

<br>

<div class="row">

  <div class="box">
    <span id="incomeTitle">Income</span>
    <b class="income">₹<span id="income">0</span></b>
  </div>

  <div class="box">
    <span id="expenseTitle">Expenses</span>
    <b class="expense">₹<span id="expense">0</span></b>
  </div>

</div>

  </div>  <!-- ADD TRANSACTION -->  <div class="card"><h3 id="addTitle">Add Transaction</h3>

<select id="type">
  <option value="income">Income</option>
  <option value="expense">Expense</option>
</select>

<input
  id="amount"
  type="number"
  placeholder="Amount"
  inputmode="decimal"
>

<input
  id="category"
  type="text"
  placeholder="Category"
>

<button onclick="addTransaction()" id="addBtn">
  Add Transaction
</button>

  </div>  <!-- SHOP QR PAYMENT -->  <div class="card"><h3>📷 <span id="scanTitle">Scan Shop QR</span></h3>

<p class="small" id="scanInfo">
  Scan a shop UPI QR, enter amount and open payment.
</p>

<button
  class="green"
  onclick="startScanner()"
  id="scanBtn">
  📷 Scan Shop QR
</button>

<div id="reader"></div>

<div id="qrResult" class="qr-result">

  <b>Shop Name:</b>
  <span id="shopName">-</span>

  <br><br>

  <b>UPI ID:</b>
  <span id="shopUpi">-</span>

  <input
    id="payAmount"
    type="number"
    placeholder="Enter Amount ₹"
    inputmode="decimal"
  >

  <button
    class="orange"
    onclick="payWithPaytm()">
    💳 Pay with Paytm
  </button>

  <button
    class="dark"
    onclick="closeScanner()">
    Close
  </button>

</div>

  </div>  <!-- TRANSACTION HISTORY -->  <div class="card"><h3 id="historyTitle">Transaction History</h3>

<div id="history">
  No transactions yet.
</div>

  </div></div><!-- QR SCANNER LIBRARY --><script src="https://unpkg.com/html5-qrcode"></script><script>

let transactions =
JSON.parse(localStorage.getItem("transactions") || "[]");

let currentLanguage = "en";

let scannedUPI = null;

let scanner = null;


/* -------------------------
   LANGUAGE
------------------------- */

function toggleLanguage(){

  if(currentLanguage === "en"){
    currentLanguage = "te";
    document.getElementById("langBtn").innerText = "English";
  }else{
    currentLanguage = "en";
    document.getElementById("langBtn").innerText = "తెలుగు";
  }

  updateLanguage();
}


function updateLanguage(){

  if(currentLanguage === "te"){

    document.getElementById("title").innerText =
      "మై మనీ";

    document.getElementById("subtitle").innerText =
      "ఆదాయం & ఖర్చులు";

    document.getElementById("balanceTitle").innerText =
      "మొత్తం బ్యాలెన్స్";

    document.getElementById("incomeTitle").innerText =
      "ఆదాయం";

    document.getElementById("expenseTitle").innerText =
      "ఖర్చులు";

    document.getElementById("addTitle").innerText =
      "లావాదేవీ జోడించండి";

    document.getElementById("addBtn").innerText =
      "జోడించండి";

    document.getElementById("scanTitle").innerText =
      "షాప్ QR స్కాన్";

    document.getElementById("scanInfo").innerText =
      "షాప్ UPI QR స్కాన్ చేసి, మొత్తం నమోదు చేసి పేమెంట్ చేయండి.";

    document.getElementById("scanBtn").innerText =
      "📷 షాప్ QR స్కాన్";

    document.getElementById("historyTitle").innerText =
      "లావాదేవీల చరిత్ర";

  }else{

    document.getElementById("title").innerText =
      "My Money";

    document.getElementById("subtitle").innerText =
      "Income & Expenses";

    document.getElementById("balanceTitle").innerText =
      "Total Balance";

    document.getElementById("incomeTitle").innerText =
      "Income";

    document.getElementById("expenseTitle").innerText =
      "Expenses";

    document.getElementById("addTitle").innerText =
      "Add Transaction";

    document.getElementById("addBtn").innerText =
      "Add Transaction";

    document.getElementById("scanTitle").innerText =
      "Scan Shop QR";

    document.getElementById("scanInfo").innerText =
      "Scan a shop UPI QR, enter amount and open payment.";

    document.getElementById("scanBtn").innerText =
      "📷 Scan Shop QR";

    document.getElementById("historyTitle").innerText =
      "Transaction History";
  }
}


/* -------------------------
   ADD TRANSACTION
------------------------- */

function addTransaction(){

  let type =
    document.getElementById("type").value;

  let amount =
    Number(document.getElementById("amount").value);

  let category =
    document.getElementById("category").value.trim();

  if(!amount || amount <= 0){

    alert("Please enter amount");

    return;
  }

  transactions.unshift({

    id:Date.now(),

    type:type,

    amount:amount,

    category:category || "Other",

    date:new Date().toLocaleString()

  });

  localStorage.setItem(
    "transactions",
    JSON.stringify(transactions)
  );

  document.getElementById("amount").value = "";

  document.getElementById("category").value = "";

  updateDashboard();

}


/* -------------------------
   DASHBOARD
------------------------- */

function updateDashboard(){

  let income = 0;

  let expense = 0;

  transactions.forEach(t => {

    if(t.type === "income"){
      income += Number(t.amount);
    }

    if(t.type === "expense"){
      expense += Number(t.amount);
    }

  });

  document.getElementById("income").innerText =
    income.toLocaleString("en-IN");

  document.getElementById("expense").innerText =
    expense.toLocaleString("en-IN");

  document.getElementById("balance").innerText =
    (income - expense).toLocaleString("en-IN");


  let history =
    document.getElementById("history");

  if(transactions.length === 0){

    history.innerHTML =
      "No transactions yet.";

    return;
  }


  history.innerHTML = transactions.map(t => {

    let sign =
      t.type === "income" ? "+" : "-";

    let cls =
      t.type === "income" ? "income" : "expense";

    return `

      <div class="transaction">

        <b>${t.category}</b>

        <span class="${cls}"
              style="float:right">

          ${sign} ₹${Number(t.amount)
            .toLocaleString("en-IN")}

        </span>

        <br>

        <span class="small">
          ${t.date}
        </span>

      </div>

    `;

  }).join("");

}


/* -------------------------
   START QR SCANNER
------------------------- */

function startScanner(){

  document.getElementById("reader").innerHTML = "";

  scanner = new Html5Qrcode("reader");

  scanner.start(

    { facingMode:"environment" },

    {
      fps:10,
      qrbox:{
        width:250,
        height:250
      }
    },

    qrCodeMessage => {

      handleQR(qrCodeMessage);

    },

    errorMessage => {

      /* Ignore scanning errors */

    }

  ).catch(err => {

    alert(
      "Camera permission ఇవ్వాలి.\n\n" +
      "Please allow camera permission."
    );

  });

}


/* -------------------------
   READ UPI QR
------------------------- */

function handleQR(text){

  if(!text.toLowerCase().startsWith("upi://pay")){

    alert(
      "This is not a UPI payment QR."
    );

    return;
  }


  try{

    let url = new URL(text);

    let pa = url.searchParams.get("pa");

    let pn = url.searchParams.get("pn");

    let existingAmount =
      url.searchParams.get("am");


    if(!pa){

      alert("UPI ID not found.");

      return;
    }


    scannedUPI = {

      pa:pa,

      pn:pn || "Shop",

      am:existingAmount || ""

    };


    document.getElementById("shopName").innerText =
      scannedUPI.pn;

    document.getElementById("shopUpi").innerText =
      scannedUPI.pa;


    if(existingAmount){

      document.getElementById("payAmount").value =
        existingAmount;

    }


    document.getElementById("qrResult").style.display =
      "block";


    stopScanner();

  }catch(error){

    alert(
      "Unable to read this UPI QR."
    );

  }

}


/* -------------------------
   STOP SCANNER
------------------------- */

function stopScanner(){

  if(scanner){

    scanner.stop()
      .then(() => {

        scanner.clear();

      })
      .catch(() => {});

  }

}


/* -------------------------
   CLOSE
------------------------- */

function closeScanner(){

  stopScanner();

  document.getElementById("reader").innerHTML = "";

  document.getElementById("qrResult").style.display =
    "none";

}


/* -------------------------
   PAY WITH PAYTM
------------------------- */

function payWithPaytm(){

  if(!scannedUPI){

    alert("Please scan shop QR first.");

    return;
  }


  let amount =
    Number(
      document.getElementById("payAmount").value
    );


  if(!amount || amount <= 0){

    alert("Please enter payment amount.");

    return;
  }


  /*
    Standard UPI payment URI.
    Android will try to open a
    UPI payment application.
  */

  let params = new URLSearchParams();

  params.set("pa", scannedUPI.pa);

  params.set("pn", scannedUPI.pn);

  params.set("am", amount.toFixed(2));

  params.set("cu", "INR");


  let upiURL =
    "upi://pay?" + params.toString();


  /*
    Try Android UPI handler.
  */

  window.location.href = upiURL;

}


/* -------------------------
   LOAD
------------------------- */

updateDashboard();


/* -------------------------
   SERVICE WORKER
------------------------- */

if("serviceWorker" in navigator){

  window.addEventListener("load", () => {

    navigator.serviceWorker.register("sw.js")
      .catch(() => {});

  });

}

</script></body>
</html>
