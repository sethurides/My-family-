<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#0f766e">
  <meta name="description"
        content="My Money - Simple personal money manager">

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- App Icons -->
  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icon-192.png">

  <link rel="apple-touch-icon"
        href="./icon-192.png">

  <title>My Money</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7f7;
      color: #222;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: #ffffff;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      padding: 18px;
    }

    .balance-card {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .balance-card small {
      opacity: 0.9;
    }

    .balance {
      font-size: 32px;
      font-weight: bold;
      margin-top: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .small-card {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 16px;
    }

    .small-card span {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 7px;
    }

    .small-card strong {
      font-size: 20px;
    }

    .income {
      color: #15803d;
    }

    .expense {
      color: #dc2626;
    }

    .section-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    button {
      border: none;
      border-radius: 13px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-income {
      background: #dcfce7;
      color: #166534;
    }

    .add-expense {
      background: #fee2e2;
      color: #991b1b;
    }

    .install-btn {
      width: 100%;
      background: #0f766e;
      color: white;
      margin-bottom: 20px;
      display: none;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>My Money</h1>
      <p>Simple • Smart • Personal Money Manager</p>
    </header>

    <main class="content">

      <button id="installBtn" class="install-btn">
        📲 Install My Money App
      </button>

      <div class="balance-card">
        <small>Current Balance</small>
        <div class="balance" id="balance">
          ₹0
        </div>
      </div>

      <div class="cards">

        <div class="small-card">
          <span>Total Income</span>
          <strong class="income" id="income">
            ₹0
          </strong>
        </div>

        <div class="small-card">
          <span>Total Expense</span>
          <strong class="expense" id="expense">
            ₹0
          </strong>
        </div>

      </div>

      <div class="section-title">
        Quick Actions
      </div>

      <div class="actions">

        <button class="add-income"
                onclick="addIncome()">
          + Add Income
        </button>

        <button class="add-expense"
                onclick="addExpense()">
          − Add Expense
        </button>

      </div>

      <div class="section-title">
        Recent Transactions
      </div>

      <div id="transactions">
        <div class="empty">
          No transactions yet
        </div>
      </div>

    </main>

    <footer>
      © 2026 My Money
    </footer>

  </div>

  <script>

    /* =========================
       BASIC MONEY DATA
    ========================= */

    let income = Number(
      localStorage.getItem("myMoneyIncome") || 0
    );

    let expense = Number(
      localStorage.getItem("myMoneyExpense") || 0
    );

    function updateMoney() {

      document.getElementById("income").textContent =
        "₹" + income.toLocaleString("en-IN");

      document.getElementById("expense").textContent =
        "₹" + expense.toLocaleString("en-IN");

      const balance = income - expense;

      document.getElementById("balance").textContent =
        "₹" + balance.toLocaleString("en-IN");

      localStorage.setItem(
        "myMoneyIncome",
        income
      );

      localStorage.setItem(
        "myMoneyExpense",
        expense
      );
    }

    function addIncome() {

      const amount = prompt(
        "Enter income amount:"
      );

      if (amount === null) return;

      const value = Number(amount);

      if (!value || value <= 0) {
        alert("Please enter a valid amount.");
        return;
      }

      income += value;

      updateMoney();
    }

    function addExpense() {

      const amount = prompt(
        "Enter expense amount:"
      );

      if (amount === null) return;

      const value = Number(amount);

      if (!value || value <= 0) {
        alert("Please enter a valid amount.");
        return;
      }

      expense += value;

      updateMoney();
    }


    /* =========================
       PWA SERVICE WORKER
    ========================= */

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function () {

          navigator.serviceWorker
            .register("./sw.js")
            .then(function () {
              console.log(
                "My Money Service Worker registered"
              );
            })
            .catch(function (error) {
              console.log(
                "Service Worker error:",
                error
              );
            });

        }
      );

    }


    /* =========================
       PWA INSTALL
    ========================= */

    let deferredPrompt = null;

    const installBtn =
      document.getElementById("installBtn");

    window.addEventListener(
      "beforeinstallprompt",
      function (event) {

        event.preventDefault();

        deferredPrompt = event;

        installBtn.style.display = "block";

      }
    );

    installBtn.addEventListener(
      "click",
      async function () {

        if (!deferredPrompt) {

          alert(
            "Install option is not available yet. " +
            "Please open this app in Chrome and try again."
          );

          return;
        }

        deferredPrompt.prompt();

        const result =
          await deferredPrompt.userChoice;

        console.log(
          "Install result:",
          result.outcome
        );

        deferredPrompt = null;

        installBtn.style.display = "none";

      }
    );


    /* =========================
       INITIAL LOAD
    ========================= */

    updateMoney();

  </script>

</body>
</html>
