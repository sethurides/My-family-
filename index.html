<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4c400">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>My Money</title>

<link rel="manifest" href="manifest.json">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#fffdf5;
    color:#222;
}

header{
    background:#f4c400;
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.balance{
    background:#fff;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 3px 10px #ddd;
    text-align:center;
}

.balance h2{
    margin-bottom:8px;
}

.amount{
    font-size:30px;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:15px;
}

.card{
    background:#fff;
    padding:18px 10px;
    border-radius:14px;
    text-align:center;
    box-shadow:0 2px 8px #ddd;
}

.income{
    color:green;
}

.expense{
    color:#d00;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    border:0;
    border-radius:12px;
    padding:15px 10px;
    font-size:16px;
    font-weight:bold;
    background:#f4c400;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.back{
    margin-bottom:15px;
    background:#eee;
}

input,select{
    width:100%;
    padding:13px;
    margin:8px 0 12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.transaction{
    background:#fff;
    padding:14px;
    margin:10px 0;
    border-radius:12px;
    box-shadow:0 2px 7px #ddd;
}

.transaction .top{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
}

.small{
    color:#666;
    font-size:13px;
    margin-top:6px;
}

.report{
    background:#fff;
    padding:15px;
    margin:10px 0;
    border-radius:12px;
    box-shadow:0 2px 7px #ddd;
}

.hidden{
    display:none;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}
</style>
</head>

<body>

<header>My Money</header>

<div class="container">

<!-- HOME -->
<div id="homePage" class="page active">

    <div class="balance">
        <h2>Current Balance</h2>
        <div class="amount" id="balanceAmount">₹0.00</div>
    </div>

    <div class="cards">
        <div class="card income">
            <div>Income</div>
            <strong id="incomeAmount">₹0.00</strong>
        </div>

        <div class="card expense">
            <div>Payments</div>
            <strong id="paymentAmount">₹0.00</strong>
        </div>
    </div>

    <div class="buttons">

        <button onclick="showPage('addPage')">
            + Income
        </button>

        <button onclick="openExpense()">
            + Expense
        </button>

        <button onclick="showPage('cashPage')">
            💵 Hand Cash
        </button>

        <button onclick="showPage('receivePage')">
            📥 Receive Money
        </button>

        <button onclick="showPage('scanPage')">
            📷 Scan Shop QR
        </button>

        <button onclick="showPage('paymentsPage')">
            💳 Payments
        </button>

        <button onclick="showPage('historyPage')">
            📜 History
        </button>

        <button onclick="showPage('reportsPage')">
            📊 Reports
        </button>

    </div>
</div>


<!-- ADD TRANSACTION -->
<div id="addPage" class="page">

    <button class="back" onclick="showPage('homePage')">
        ← Back
    </button>

    <h2 id="transactionTitle">Add Income</h2>

    <label>Amount</label>
    <input id="amount" type="number" placeholder="Enter amount">

    <label>Description</label>
    <input id="description" type="text" placeholder="Example: Salary">

    <label>Category</label>
    <select id="category">
        <option value="Income">Income</option>
        <option value="Other Expense">Other Expense</option>
        <option value="Hand Cash">Hand Cash</option>
    </select>

    <button onclick="saveTransaction()" style="width:100%">
        Save Transaction
    </button>

</div>


<!-- HAND CASH -->
<div id="cashPage" class="page">

    <button class="back" onclick="showPage('homePage')">
        ← Back
    </button>

    <h2>💵 Hand Cash</h2>

    <input id="cashAmount"
           type="number"
           placeholder="Enter amount">

    <input id="cashDescription"
           type="text"
           placeholder="Description">

    <button onclick="saveCash()" style="width:100%">
        Save Hand Cash
    </button>

</div>


<!-- RECEIVE -->
<div id="receivePage" class="page">

    <button class="back" onclick="showPage('homePage')">
        ← Back
    </button>

    <h2>📥 Receive Money</h2>

    <input id="receiveAmount"
           type="number"
           placeholder="Received amount">

    <input id="receiveDescription"
           type="text"
           placeholder="From / Description">

    <button onclick="saveReceived()" style="width:100%">
        Save Received Money
    </button>

</div>


<!-- PAYMENTS -->
<div id="paymentsPage" class="page">

    <button class="back" onclick="showPage('homePage')">
        ← Back
    </button>

    <h2>💳 Payments</h2>

    <div id="paymentsList"></div>

</div>


<!-- SCAN -->
<div id="scanPage" class="page">

    <button class="back" onclick="showPage('homePage')">
        ← Back
    </button>

    <h2>📷 Scan Shop QR</h2>

    <p style="margin:15px 0">
        QR scanner will open when supported by your browser.
    </p>

    <button onclick="startQR()" style="width:100%">
        Start QR Scan
    </button>

    <div id="qrResult"
         style="margin-top:15px">
    </div>

</div>


<!-- HISTORY -->
<div id="historyPage" class="page">

    <button class="back" onclick="showPage('homePage')">
        ← Back
    </button>

    <h2>📜 Transaction History</h2>

    <div id="historyList"></div>

</div>


<!-- REPORTS -->
<div id="reportsPage" class="page">

    <button class="back" onclick="showPage('homePage')">
        ← Back
    </button>

    <h2>📊 Reports</h2>

    <div class="report">
        <b>Today</b>
        <div id="todayReport"></div>
    </div>

    <div class="report">
        <b>This Month</b>
        <div id="monthReport"></div>
    </div>

    <div class="report">
        <b>This Year</b>
        <div id="yearReport"></div>
    </div>

    <div class="report">
        <b>Overall</b>
        <div id="overallReport"></div>
    </div>

</div>

</div>


<script>

/* ================================
   SAFE STORAGE
================================ */

const STORAGE_KEY = "myMoneyTransactions";

let transactions = [];


/* ================================
   LOAD OLD DATA
================================ */

function loadTransactions(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved){

            const parsed = JSON.parse(saved);

            if(Array.isArray(parsed)){
                transactions = parsed;
            }

        }

    }catch(error){

        console.log("Data read error:",error);

        transactions = [];

    }

}


/* ================================
   SAVE DATA
================================ */

function saveData(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(transactions)
        );

    }catch(error){

        alert("Data save failed");

    }

}


/* ================================
   PAGE NAVIGATION
================================ */

function showPage(pageId){

    document
        .querySelectorAll(".page")
        .forEach(page=>{
            page.classList.remove("active");
        });

    const page =
        document.getElementById(pageId);

    if(page){

        page.classList.add("active");

    }

    updateUI();

}


/* ================================
   DATE / TIME
================================ */

function getDateTime(){

    const now = new Date();

    return {
        timestamp: now.getTime(),
        date: now.toLocaleDateString("en-IN"),
        time: now.toLocaleTimeString("en-IN"),
        day: now.toLocaleDateString(
            "en-IN",
            {weekday:"long"}
        ),
        month: now.toLocaleDateString(
            "en-IN",
            {month:"long"}
        ),
        year: now.getFullYear()
    };

}


/* ================================
   ADD INCOME
================================ */

function saveTransaction(){

    const amount =
        Number(
            document.getElementById("amount").value
        );

    const description =
        document.getElementById("description").value
        .trim();

    const category =
        document.getElementById("category").value;


    if(!amount || amount <= 0){

        alert("Please enter amount");

        return;

    }


    const dt = getDateTime();


    const transaction = {

        id: Date.now(),

        type:
            category === "Income"
            ? "income"
            : "expense",

        category: category,

        amount: amount,

        description:
            description || category,

        date: dt.date,

        time: dt.time,

        day: dt.day,

        month: dt.month,

        year: dt.year,

        timestamp: dt.timestamp

    };


    transactions.push(transaction);

    saveData();

    document.getElementById("amount").value = "";

    document.getElementById("description").value = "";

    showPage("homePage");

}


/* ================================
   EXPENSE
================================ */

function openExpense(){

    showPage("addPage");

    document.getElementById(
        "transactionTitle"
    ).innerText = "Add Expense";

    document.getElementById(
        "category"
    ).value = "Other Expense";

}


/* ================================
   HAND CASH
================================ */

function saveCash(){

    const amount =
        Number(
            document.getElementById("cashAmount").value
        );

    const description =
        document.getElementById(
            "cashDescription"
        ).value.trim();


    if(!amount || amount <= 0){

        alert("Please enter amount");

        return;

    }


    const dt = getDateTime();


    transactions.push({

        id: Date.now(),

        type:"expense",

        category:"Hand Cash",

        amount:amount,

        description:
            description || "Hand Cash",

        date:dt.date,

        time:dt.time,

        day:dt.day,

        month:dt.month,

        year:dt.year,

        timestamp:dt.timestamp

    });


    saveData();

    document.getElementById(
        "cashAmount"
    ).value = "";

    document.getElementById(
        "cashDescription"
    ).value = "";

    showPage("homePage");

}


/* ================================
   RECEIVE MONEY
================================ */

function saveReceived(){

    const amount =
        Number(
            document.getElementById(
                "receiveAmount"
            ).value
        );

    const description =
        document.getElementById(
            "receiveDescription"
        ).value.trim();


    if(!amount || amount <= 0){

        alert("Please enter amount");

        return;

    }


    const dt = getDateTime();


    transactions.push({

        id:Date.now(),

        type:"income",

        category:"Received Money",

        amount:amount,

        description:
            description || "Received Money",

        date:dt.date,

        time:dt.time,

        day:dt.day,

        month:dt.month,

        year:dt.year,

        timestamp:dt.timestamp

    });


    saveData();


    document.getElementById(
        "receiveAmount"
    ).value = "";

    document.getElementById(
        "receiveDescription"
    ).value = "";


    showPage("homePage");

}


/* ================================
   PAYMENT
================================ */

function addPayment(amount, description, upi){

    const dt = getDateTime();


    transactions.push({

        id:Date.now(),

        type:"expense",

        category:"Payments",

        amount:Number(amount),

        description:
            description || "UPI Payment",

        upi:upi || "",

        date:dt.date,

        time:dt.time,

        day:dt.day,

        month:dt.month,

        year:dt.year,

        timestamp:dt.timestamp

    });


    saveData();

    updateUI();

}


/* ================================
   QR
================================ */

function startQR(){

    const result =
        document.getElementById("qrResult");

    result.innerHTML =
        "<p>QR scanner ready.</p>" +
        "<p>Camera permission is required.</p>";

}


/* ================================
   DISPLAY HISTORY
================================ */

function updateHistory(){

    const box =
        document.getElementById("historyList");

    if(!box) return;


    if(transactions.length === 0){

        box.innerHTML =
            '<div class="empty">No transactions yet</div>';

        return;

    }


    const sorted =
        [...transactions].sort(
            (a,b)=>
                (b.timestamp || 0) -
                (a.timestamp || 0)
        );


    box.innerHTML =
        sorted.map(t=>{

            const sign =
                t.type === "income"
                ? "+"
                : "-";

            const cls =
                t.type === "income"
                ? "income"
                : "expense";


            return `
                <div class="transaction">

                    <div class="top">

                        <span>
                            ${escapeHTML(
                                t.category || "Transaction"
                            )}
                        </span>

                        <span class="${cls}">
                            ${sign} ₹${Number(
                                t.amount || 0
                            ).toFixed(2)}
                        </span>

                    </div>

                    <div>
                        ${escapeHTML(
                            t.description || ""
                        )}
                    </div>

                    <div class="small">
                        ${escapeHTML(t.date || "")}
                        ·
                        ${escapeHTML(t.time || "")}
                        ·
                        ${escapeHTML(t.day || "")}
                    </div>

                </div>
            `;

        }).join("");

}


/* ================================
   PAYMENTS LIST
================================ */

function updatePayments(){

    const box =
        document.getElementById(
            "paymentsList"
        );

    if(!box) return;


    const payments =
        transactions
        .filter(t =>
            t.category === "Payments"
        )
        .sort(
            (a,b)=>
                (b.timestamp || 0) -
                (a.timestamp || 0)
        );


    if(payments.length === 0){

        box.innerHTML =
            '<div class="empty">No Payments</div>';

        return;

    }


    box.innerHTML =
        payments.map(t=>`

            <div class="transaction">

                <div class="top">

                    <span>
                        ${escapeHTML(
                            t.description ||
                            "Payment"
                        )}
                    </span>

                    <span class="expense">
                        - ₹${Number(
                            t.amount || 0
                        ).toFixed(2)}
                    </span>

                </div>

                <div class="small">
                    ${escapeHTML(t.date || "")}
                    ·
                    ${escapeHTML(t.time || "")}
                </div>

            </div>

        `).join("");

}


/* ================================
   REPORTS
================================ */

function calculate(list){

    let income = 0;

    let payments = 0;

    let other = 0;


    list.forEach(t=>{

        const amount =
            Number(t.amount || 0);


        if(t.type === "income"){

            income += amount;

        }else{

            if(t.category === "Payments"){

                payments += amount;

            }else{

                other += amount;

            }

        }

    });


    return {

        income,

        payments,

        other,

        balance:
            income - payments - other

    };

}


function updateReports(){

    const now = new Date();

    const today =
        now.toLocaleDateString("en-IN");

    const month =
        now.getMonth();

    const year =
        now.getFullYear();


    const todayList =
        transactions.filter(
            t=>t.date === today
        );


    const monthList =
        transactions.filter(t=>{

            const d =
                new Date(
                    t.timestamp || 0
                );

            return d.getMonth() === month &&
                   d.getFullYear() === year;

        });


    const yearList =
        transactions.filter(t=>{

            const d =
                new Date(
                    t.timestamp || 0
                );

            return d.getFullYear() === year;

        });


    const overall =
        calculate(transactions);

    const todayData =
        calculate(todayList);

    const monthData =
        calculate(monthList);

    const yearData =
        calculate(yearList);


    document.getElementById(
        "todayReport"
    ).innerHTML =
        reportHTML(todayData);


    document.getElementById(
        "monthReport"
    ).innerHTML =
        reportHTML(monthData);


    document.getElementById(
        "yearReport"
    ).innerHTML =
        reportHTML(yearData);


    document.getElementById(
        "overallReport"
    ).innerHTML =
        reportHTML(overall);

}


function reportHTML(data){

    return `
        Income: ₹${data.income.toFixed(2)}<br>
        Payments: ₹${data.payments.toFixed(2)}<br>
        Other Expenses: ₹${data.other.toFixed(2)}<br>
        <b>Balance: ₹${data.balance.toFixed(2)}</b>
    `;

}


/* ================================
   HOME TOTALS
================================ */

function updateHome(){

    let income = 0;

    let expense = 0;

    let payments = 0;


    transactions.forEach(t=>{

        const amount =
            Number(t.amount || 0);


        if(t.type === "income"){

            income += amount;

        }else{

            expense += amount;

            if(t.category === "Payments"){

                payments += amount;

            }

        }

    });


    const balance =
        income - expense;


    document.getElementById(
        "incomeAmount"
    ).innerText =
        "₹" + income.toFixed(2);


    document.getElementById(
        "paymentAmount"
    ).innerText =
        "₹" + payments.toFixed(2);


    document.getElementById(
        "balanceAmount"
    ).innerText =
        "₹" + balance.toFixed(2);

}


/* ================================
   UI
================================ */

function updateUI(){

    updateHome();

    updateHistory();

    updatePayments();

    updateReports();

}


/* ================================
   SECURITY
================================ */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ================================
   START
================================ */

loadTransactions();

updateUI();
