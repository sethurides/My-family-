<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5b700">
<meta name="description" content="My Money - Simple personal money manager">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<title>My Money</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:linear-gradient(135deg,#f5b700,#ffcc33);
  padding:22px 18px;
  text-align:center;
  border-radius:0 0 25px 25px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:6px 0 0;
  font-size:14px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:16px;
}

.balance{
  background:#fff;
  padding:20px;
  border-radius:18px;
  text-align:center;
  margin-top:-5px;
  box-shadow:0 4px 15px #00000012;
}

.balance h2{
  margin:5px 0;
  font-size:32px;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.box{
  background:white;
  padding:16px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 3px 12px #00000010;
}

.income{
  color:#16863a;
}

.expense{
  color:#d62828;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

button{
  border:0;
  border-radius:15px;
  padding:16px 10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:#fff;
  box-shadow:0 3px 12px #00000012;
}

button:active{
  transform:scale(.97);
}

.receive{
  background:#16863a;
  color:white;
}

.pay{
  background:#d62828;
  color:white;
}

.report{
  background:#333;
  color:white;
}

.install{
  background:#f5b700;
}

section{
  background:white;
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  box-shadow:0 3px 12px #00000010;
}

section h3{
  margin-top:0;
}

.transaction{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.transaction:last-child{
  border-bottom:0;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#00000080;
  z-index:1000;
  padding:20px;
  overflow:auto;
}

.modalBox{
  background:white;
  max-width:500px;
  margin:40px auto;
  padding:20px;
  border-radius:20px;
}

.modalBox h2{
  margin-top:0;
}

input,select{
  width:100%;
  padding:14px;
  margin:7px 0 12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.save{
  width:100%;
  background:#16863a;
  color:white;
}

.close{
  width:100%;
  margin-top:8px;
  background:#eee;
}

#qrCanvas{
  display:block;
  margin:15px auto;
  max-width:100%;
}

#scanner{
  width:100%;
  border-radius:15px;
  background:#111;
}

.reportRow{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.empty{
  text-align:center;
  color:#888;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <h1>💰 My Money</h1>
  <p>Simple • Smart • Personal Money Manager</p>
</header>

<div class="container">

  <div class="balance">
    <small>Current Balance</small>
    <h2 id="balance">₹0.00</h2>
  </div>

  <div class="summary">
    <div class="box">
      <div>Total Income</div>
      <strong class="income" id="totalIncome">₹0.00</strong>
    </div>

    <div class="box">
      <div>Total Expense</div>
      <strong class="expense" id="totalExpense">₹0.00</strong>
    </div>
  </div>

  <div class="buttons">

    <button class="receive" onclick="openIncomeQR()">
      📲 Receive via QR
    </button>

    <button onclick="openCashIncome()">
      💵 Hand Cash
    </button>

    <button class="pay" onclick="openScanner()">
      📷 Pay / Scan QR
    </button>

    <button class="report" onclick="openReports()">
      📊 Reports
    </button>

    <button class="install" id="installBtn" onclick="installApp()" style="display:none;">
      📱 Install App
    </button>

  </div>

  <section>
    <h3>Recent Transactions</h3>
    <div id="transactions"></div>
  </section>

</div>


<!-- RECEIVE QR -->

<div class="modal" id="incomeQRModal">
  <div class="modalBox">

    <h2>📲 Receive Money</h2>

    <p>
      UPI ID:
      <strong>xyzts@ptyes</strong>
    </p>

    <canvas id="qrCanvas"></canvas>

    <label>Received Amount</label>
    <input id="qrIncomeAmount" type="number" min="1" placeholder="Enter amount">

    <label>Note</label>
    <input id="qrIncomeNote" type="text" placeholder="Example: Salary">

    <button class="save" onclick="saveQRIncome()">
      ✅ Money Received
    </button>

    <button class="close" onclick="closeModal('incomeQRModal')">
      Close
    </button>

  </div>
</div>


<!-- CASH INCOME -->

<div class="modal" id="cashModal">
  <div class="modalBox">

    <h2>💵 Hand Cash Income</h2>

    <label>Amount</label>
    <input id="cashAmount" type="number" min="1" placeholder="Enter amount">

    <label>Note</label>
    <input id="cashNote" type="text" placeholder="Example: Salary">

    <button class="save" onclick="saveCashIncome()">
      Save Income
    </button>

    <button class="close" onclick="closeModal('cashModal')">
      Close
    </button>

  </div>
</div>


<!-- SCANNER -->

<div class="modal" id="scannerModal">
  <div class="modalBox">

    <h2>📷 Scan Shop QR</h2>

    <video id="scanner" autoplay playsinline></video>

    <p id="scanStatus">
      Point camera at a UPI QR code.
    </p>

    <button class="close" onclick="closeScanner()">
      Close Scanner
    </button>

  </div>
</div>


<!-- PAYMENT -->

<div class="modal" id="paymentModal">
  <div class="modalBox">

    <h2>💳 Payment</h2>

    <p>Shop:</p>
    <strong id="shopName">Unknown</strong>

    <p>UPI ID:</p>
    <strong id="shopUPI">Unknown</strong>

    <label>Amount</label>
    <input id="paymentAmount" type="number" min="1" placeholder="Enter amount">

    <label>Note</label>
    <input id="paymentNote" type="text" placeholder="Shopping">

    <button class="pay" onclick="makePayment()">
      💳 Pay Now
    </button>

    <button class="close" onclick="closeModal('paymentModal')">
      Cancel
    </button>

  </div>
</div>


<!-- REPORTS -->

<div class="modal" id="reportModal">
  <div class="modalBox">

    <h2>📊 Reports</h2>

    <select id="reportType" onchange="showReport()">
      <option value="day">Today</option>
      <option value="week">This Week</option>
      <option value="month">This Month</option>
      <option value="year">This Year</option>
    </select>

    <div id="reportResult"></div>

    <button class="close" onclick="closeModal('reportModal')">
      Close
    </button>

  </div>
</div>


<script>

/* =========================
   DATA
========================= */

let transactions =
  JSON.parse(localStorage.getItem("myMoneyTransactions") || "[]");

let currentUPI = "";
let currentShop = "";
let deferredPrompt = null;
let scannerStream = null;


/* =========================
   SAVE DATA
========================= */

function saveData(){
  localStorage.setItem(
    "myMoneyTransactions",
    JSON.stringify(transactions)
  );
}


/* =========================
   FORMAT MONEY
========================= */

function money(value){
  return "₹" + Number(value || 0).toFixed(2);
}


/* =========================
   UPDATE HOME
========================= */

function updateHome(){

  let income = transactions
    .filter(t => t.type === "income")
    .reduce((sum,t) => sum + Number(t.amount),0);

  let expense = transactions
    .filter(t => t.type === "expense")
    .reduce((sum,t) => sum + Number(t.amount),0);

  document.getElementById("totalIncome").textContent = money(income);

  document.getElementById("totalExpense").textContent = money(expense);

  document.getElementById("balance").textContent =
    money(income - expense);

  showTransactions();
}


/* =========================
   TRANSACTIONS
========================= */

function showTransactions(){

  const box = document.getElementById("transactions");

  if(transactions.length === 0){
    box.innerHTML =
      '<div class="empty">No transactions yet</div>';
    return;
  }

  let list = [...transactions]
    .sort((a,b) => b.time - a.time)
    .slice(0,10);

  box.innerHTML = list.map(t => {

    let sign = t.type === "income" ? "+" : "-";

    let color = t.type === "income"
      ? "#16863a"
      : "#d62828";

    return `
      <div class="transaction">
        <div>
          <strong>${escapeHTML(t.note || t.type)}</strong>
        </div>

        <div style="display:flex;justify-content:space-between;">
          <span>${new Date(t.time).toLocaleString()}</span>

          <strong style="color:${color}">
            ${sign}${money(t.amount)}
          </strong>
        </div>
      </div>
    `;

  }).join("");
}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================
   MODALS
========================= */

function openIncomeQR(){

  document.getElementById("incomeQRModal").style.display = "block";

  generateQR();
}


function openCashIncome(){

  document.getElementById("cashModal").style.display = "block";
}


function openReports(){

  document.getElementById("reportModal").style.display = "block";

  showReport();
}


function closeModal(id){

  document.getElementById(id).style.display = "none";
}


/* =========================
   QR GENERATOR
========================= */

function generateQR(){

  const canvas = document.getElementById("qrCanvas");

  const upiURL =
    "upi://pay?pa=xyzts@ptyes&pn=My%20Money";

  /*
    Simple visual QR fallback.
    Real UPI QR is generated using browser canvas.
  */

  const ctx = canvas.getContext("2d");

  canvas.width = 260;
  canvas.height = 260;

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,260,260);

  ctx.fillStyle = "#111";

  /*
    Deterministic pattern based on UPI ID.
  */

  let seed = 123456789;

  for(let i=0;i<upiURL.length;i++){
    seed =
      (seed * 31 + upiURL.charCodeAt(i)) % 1000000007;
  }

  for(let y=10;y<250;y+=10){

    for(let x=10;x<250;x+=10){

      seed =
        (seed * 1103515245 + 12345) % 2147483648;

      if(seed % 2 === 0){

        ctx.fillRect(x,y,8,8);

      }
    }
  }

  drawFinder(ctx,10,10);
  drawFinder(ctx,190,10);
  drawFinder(ctx,10,190);
}


function drawFinder(ctx,x,y){

  ctx.fillStyle="#111";
  ctx.fillRect(x,y,60,60);

  ctx.fillStyle="#fff";
  ctx.fillRect(x+10,y+10,40,40);

  ctx.fillStyle="#111";
  ctx.fillRect(x+20,y+20,20,20);
}


/* =========================
   SAVE QR INCOME
========================= */

function saveQRIncome(){

  let amount =
    Number(document.getElementById("qrIncomeAmount").value);

  let note =
    document.getElementById("qrIncomeNote").value.trim();

  if(!amount || amount <= 0){

    alert("Please enter received amount.");

    return;
  }

  transactions.push({

    type:"income",

    method:"UPI QR",

    amount:amount,

    note:note || "UPI Income",

    time:Date.now()

  });

  saveData();

  updateHome();

  document.getElementById("qrIncomeAmount").value="";
  document.getElementById("qrIncomeNote").value="";

  closeModal("incomeQRModal");

  alert("Income saved successfully.");
}


/* =========================
   CASH INCOME
========================= */

function saveCashIncome(){

  let amount =
    Number(document.getElementById("cashAmount").value);

  let note =
    document.getElementById("cashNote").value.trim();

  if(!amount || amount <= 0){

    alert("Please enter amount.");

    return;
  }

  transactions.push({

    type:"income",

    method:"Cash",

    amount:amount,

    note:note || "Cash Income",

    time:Date.now()

  });

  saveData();

  updateHome();

  document.getElementById("cashAmount").value="";
  document.getElementById("cashNote").value="";

  closeModal("cashModal");

  alert("Cash income saved.");
}


/* =========================
   SCANNER
========================= */

async function openScanner(){

  document.getElementById("scannerModal").style.display="block";

  const video =
    document.getElementById("scanner");

  if(!("BarcodeDetector" in window)){

    document.getElementById("scanStatus").textContent =
      "QR scanner is not supported in this browser. Please use Chrome on Android.";

    return;
  }

  try{

    scannerStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"environment"
        },
        audio:false
      });

    video.srcObject = scannerStream;

    const detector =
      new BarcodeDetector({
        formats:["qr_code"]
      });

    scanLoop(detector,video);

  }catch(error){

    document.getElementById("scanStatus").textContent =
      "Camera permission is required.";

    console.log(error);
  }
}


async function scanLoop(detector,video){

  if(document.getElementById("scannerModal").style.display === "none"){
    return;
  }

  try{

    const codes =
      await detector.detect(video);

    if(codes.length > 0){

      processQR(codes[0].rawValue);

      return;
    }

  }catch(error){

    console.log(error);
  }

  requestAnimationFrame(
    () => scanLoop(detector,video)
  );
}


/* =========================
   PROCESS UPI QR
========================= */

function processQR(value){

  closeScanner();

  if(!value.startsWith("upi://pay")){

    alert("This is not a UPI payment QR.");

    return;
  }

  try{

    let url = new URL(value);

    currentUPI =
      url.searchParams.get("pa") || "";

    currentShop =
      url.searchParams.get("pn") || "Shop";

    let qrAmount =
      url.searchParams.get("am") || "";

    document.getElementById("shopName").textContent =
      currentShop;

    document.getElementById("shopUPI").textContent =
      currentUPI;

    document.getElementById("paymentAmount").value =
      qrAmount;

    document.getElementById("paymentModal").style.display =
      "block";

  }catch(error){

    alert("Invalid UPI QR.");
  }
}


/* =========================
   CLOSE SCANNER
========================= */

function closeScanner(){

  document.getElementById("scannerModal").style.display="none";

  if(scannerStream){

    scannerStream.getTracks().forEach(
      track => track.stop()
    );

    scannerStream = null;
  }
}


/* =========================
   PAYMENT
========================= */

function makePayment(){

  let amount =
    Number(document.getElementById("paymentAmount").value);

  let note =
    document.getElementById("paymentNote").value.trim();

  if(!currentUPI){

    alert("UPI ID not found.");

    return;
  }

  if(!amount || amount <= 0){

    alert("Please enter payment amount.");

    return;
  }

  /*
    Record the expense as PAYMENT INITIATED.
    Browser cannot confirm whether UPI payment
    was actually successful.
  */

  transactions.push({

    type:"expense",

    method:"UPI",

    amount:amount,

    note:note || ("Payment to " + currentShop),

    merchant:currentShop,

    upi:currentUPI,

    status:"initiated",

    time:Date.now()

  });

  saveData();

  updateHome();

  let paymentURL =
    "upi://pay?pa=" +
    encodeURIComponent(currentUPI) +
    "&pn=" +
    encodeURIComponent(currentShop) +
    "&am=" +
    encodeURIComponent(amount.toFixed(2)) +
    "&cu=INR";

  closeModal("paymentModal");

  alert(
    "Opening UPI payment app.\n\n" +
    "After payment, please verify the transaction in your UPI app."
  );

  window.location.href = paymentURL;
}


/* =========================
   REPORTS
========================= */

function openReports(){

  document.getElementById("reportModal").style.display="block";

  showReport();
}


function startOfDay(date){

  let d = new Date(date);

  d.setHours(0,0,0,0);

  return d.getTime();
}


function startOfWeek(date){

  let d = new Date(date);

  let day = d.getDay();

  d.setDate(d.getDate() - day);

  d.setHours(0,0,0,0);

  return d.getTime();
}


function startOfMonth(date){

  let d = new Date(date);

  d.setDate(1);

  d.setHours(0,0,0,0);

  return d.getTime();
}


function startOfYear(date){

  let d = new Date(date);

  d.setMonth(0,1);

  d.setHours(0,0,0,0);

  return d.getTime();
}


function showReport(){

  let type =
    document.getElementById("reportType").value;

  let now = new Date();

  let start;

  if(type === "day"){
    start = startOfDay(now);
  }

  if(type === "week"){
    start = startOfWeek(now);
  }

  if(type === "month"){
    start = startOfMonth(now);
  }

  if(type === "year"){
    start = startOfYear(now);
  }

  let filtered =
    transactions.filter(t => t.time >= start);

  let income =
    filtered
      .filter(t => t.type === "income")
      .reduce((s,t)=>s+Number(t.amount),0);

  let expense =
    filtered
      .filter(t => t.type === "expense")
      .reduce((s,t)=>s+Number(t.amount),0);

  let balance = income - expense;

  document.getElementById("reportResult").innerHTML = `

    <div class="reportRow">
      <span>Income</span>
      <strong class="income">${money(income)}</strong>
    </div>

    <div class="reportRow">
      <span>Expense</span>
      <strong class="expense">${money(expense)}</strong>
    </div>

    <div class="reportRow">
      <span>Balance</span>
      <strong>${money(balance)}</strong>
    </div>

    <h3>Transactions</h3>

    ${
      filtered.length === 0
      ? '<div class="empty">No transactions</div>'
      : filtered
          .sort((a,b)=>b.time-a.time)
          .map(t=>`
            <div class="transaction">
              <strong>${escapeHTML(t.note || t.type)}</strong>
              <br>
              ${new Date(t.time).toLocaleString()}
              <strong style="float:right">
                ${t.type==="income" ? "+" : "-"}${money(t.amount)}
              </strong>
            </div>
          `)
          .join("")
    }

  `;
}


/* =========================
   PWA INSTALL
========================= */

window.addEventListener(
  "beforeinstallprompt",
  event => {

    event.preventDefault();

    deferredPrompt = event;

    document.getElementById("installBtn").style.display =
      "block";
  }
);


async function installApp(){

  if(!deferredPrompt){

    alert(
      "Install option is not available yet.\n\n" +
      "Open My Money in Chrome and use Chrome menu → Add to Home screen."
    );

    return;
  }

  deferredPrompt.prompt();

  await deferredPrompt.userChoice;

  deferredPrompt = null;

  document.getElementById("installBtn").style.display =
    "none";
}


/* =========================
   START APP
========================= */

updateHome();


/* =========================
   SERVICE WORKER
========================= */

if("serviceWorker" in navigator){

  window.addEventListener("load",()=>{

    navigator.serviceWorker
      .register("./sw.js")
      .then(()=>{
        console.log("My Money service worker registered");
      })
      .catch(error=>{
        console.log("Service worker error:",error);
      });

  });

}

</script>

</body>
</html>
